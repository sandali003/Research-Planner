  <!-- Car body -->
  <path d="M58 206c-8 0-14-6-14-14v-18c0-17 12-30 29-33l78-12c22-30 52-50 92-55 40-5 92-3 124 6 22 6 42 22 60 44l42 8c19 4 33 20 33 39v21c0 8-6 14-14 14H58z"
        fill="#ffffff"/>
  <!-- Lower body shade -->
  <path d="M44 184h458v8c0 8-6 14-14 14H58c-8 0-14-6-14-14v-8z" fill="#dbeafe"/>

  <!-- Windows -->
  <path d="M168 129c20-25 46-40 80-43 14-1 28-1 42-1v44H168z" fill="#2563eb"/>
